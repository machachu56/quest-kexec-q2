# Valve's Steam Frame (deckard) repositories, as published on
# steamdeck-packages.steamos.cloud; hotfixes carries Steam, SteamVR, FEX,
# gamescope and the Frame's Mesa.
[options]
Architecture = aarch64
SigLevel = Optional
LocalFileSigLevel = Optional
ParallelDownloads = 8

[deckard-arch-hotfixes-release-0.4]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard-hotfixes/release/0.4.x

[core]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard/archlinux/main/$repo/os/$arch

[extra]
Server = https://steamdeck-packages.steamos.cloud/archlinux-deckard/archlinux/main/$repo/os/$arch
